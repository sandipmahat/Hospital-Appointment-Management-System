{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
    <div class="page-hero">
        <div class="page-hero-text">
            <h1>Choose a New Password</h1>
            <p>This link is single-use and will stop working once your password is reset.</p>
        </div>
    </div>

    <div class="card-panel profile-form-card" style="max-width:480px; margin:0 auto;">
        <form id="resetPasswordForm" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <div class="password-input-group">
                    <input type="password" id="password" name="password"
                           placeholder="At least 6 characters" required>
                    <button type="button" id="togglePasswordBtn" class="toggle-password-btn">Show</button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <div class="password-input-group">
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           placeholder="Re-enter new password" required>
                    <button type="button" id="toggleConfirmBtn" class="toggle-password-btn">Show</button>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="button-primary">Reset Password</button>
            </div>
        </form>
    </div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        attachFormValidation('resetPasswordForm');
        togglePasswordVisibility('password', 'togglePasswordBtn');
        togglePasswordVisibility('confirmPassword', 'toggleConfirmBtn');
    });
</script>
{% endblock %}
