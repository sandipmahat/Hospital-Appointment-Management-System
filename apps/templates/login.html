{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
    <h1>Login to Your Account</h1>
    <p>Enter your credentials to access your dashboard.</p>
    
    <form id="loginForm" method="post" class="form-card">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   data-validate="required,email"
                   placeholder="your.email@example.com"
                   required>
            <span class="field-status">Enter the email associated with your account.</span>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input-group">
                <input type="password" id="password" name="password"
                       data-validate="required,password"
                       placeholder="Enter your password"
                       required>
                <button type="button" id="togglePasswordBtn" class="toggle-password-btn button-secondary">
                    Show
                </button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-checkbox">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                Remember me on this device
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" id="submitBtn" class="button-primary">Login</button>
            <button type="button" class="button-ghost" onclick="alert('Password reset flow coming soon')">Forgot password?</button>
        </div>

        <p class="field-status" style="margin-top: 20px; text-align: center;">
            Don&rsquo;t have an account? <a href="/register" class="inline-link">Register here</a>
        </p>
    </form>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Setup form validation
        attachFormValidation('loginForm');
        
        // Setup password visibility toggle
        togglePasswordVisibility('password', 'togglePasswordBtn');
        
        // Setup form submission
        setupFormSubmission('loginForm', function(form) {
            const email = document.getElementById('email').value;
            showAlert(`Welcome back, ${email}! Logging you in...`, 'success');
            // The form will submit normally after validation
            setTimeout(() => form.submit(), 500);
        });
        
        // Add event listener to remember me checkbox
        const rememberMeCheckbox = document.getElementById('rememberMe');
        rememberMeCheckbox.addEventListener('change', function() {
            if (this.checked) {
                showAlert('Your login details will be remembered.', 'info');
            }
        });
        
        // Add focus highlighting
        addFocusHighlight('email');
        addFocusHighlight('password');
    });
</script>
{% endblock %}
