{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
    <h1>Register</h1>
    <p>Create a new account by filling out the form below.</p>
    
    <form id="registrationForm" method="post">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" 
                   data-validate="required,name"
                   placeholder="Enter your full name"
                   required>
            <span class="char-counter" id="nameCounter">0 characters</span>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" 
                   data-validate="required,email"
                   placeholder="your.email@example.com"
                   required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div style="display: flex; gap: 8px;">
                <input type="password" id="password" name="password" 
                       data-validate="required,password"
                       placeholder="At least 6 characters"
                       required
                       style="flex: 1;">
                <button type="button" id="togglePasswordBtn" class="toggle-password-btn">
                    👁️ Show
                </button>
            </div>
            <div class="password-strength" id="passwordStrength"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" 
                   data-validate="required"
                   placeholder="Re-enter your password"
                   required>
        </div>

        <button type="submit" id="submitBtn">Register</button>
        <button type="button" id="clearBtn" style="background: #6b7280; margin-left: 8px;">Clear Form</button>
    </form>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Setup form validation
        attachFormValidation('registrationForm');
        
        // Setup character counter for name field
        setupCharacterCounter('name', 'nameCounter');
        
        // Setup password visibility toggle
        togglePasswordVisibility('password', 'togglePasswordBtn');
        
        // Setup password strength indicator
        updatePasswordStrength('password', 'passwordStrength');
        
        // Setup password match validation
        validatePasswordMatch('password', 'confirmPassword');
        
        // Setup form submission
        setupFormSubmission('registrationForm', function(form) {
            showAlert('Registration successful! Welcome aboard.', 'success');
            // The form will submit normally after validation
            setTimeout(() => form.submit(), 500);
        });
        
        // Setup clear button
        document.getElementById('clearBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to clear all fields?')) {
                clearForm('registrationForm');
                clearFormErrors('registrationForm');
            }
        });
    });
</script>
{% endblock %}
